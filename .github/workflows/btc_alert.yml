name: BTC Daily Alert

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-btc-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 스크립트 실행
        run: python btc_monitor.py

      - name: 엑셀 파일 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 충돌 방지: GitHub 최신 파일 받아온 후 스크립트 재실행
          git stash
          git pull origin main
          git stash drop || true
          python btc_monitor.py
          
          git add btc_history.xlsx
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "BTC update: $(date +'%Y-%m-%d')"
            git push
          fi
