name: BTC Daily Alert

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-btc-monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 스크립트 실행
        run: python btc_monitor.py

      - name: 엑셀 파일 GitHub에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add btc_history.xlsx
          git diff --staged --quiet || git commit -m "BTC update: $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push